name: Daily Stock Data Update

on:
  schedule:
    # 매일 한국 시간 오후 5시 (UTC 08:00) 실행
    - cron: "0 8 * * *"
  # 수동 실행 버튼 추가
  workflow_dispatch:
  # main 브랜치에 코드가 푸시(Push)되면 실행
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout content
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Collector
        run: |
          python stock_data_collector.py
          # 생성된 json 파일들을 public 폴더로 이동 (이미 있다면 덮어쓰기)
          mv company_list.json public/
          mv stock_data.json public/

      - name: Commit and Push Data Changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add public/stock_data.json public/company_list.json
          # 변경 사항이 있을 때만 커밋
          git commit -m "Auto-update stock data" || exit 0
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Node dependencies
        run: npm install

      - name: Build and Deploy to GitHub Pages
        run: |
          npm run build
          # gh-pages 패키지를 사용해 배포 (git config 필요)
          git remote set-url origin https://git:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          npm run deploy
